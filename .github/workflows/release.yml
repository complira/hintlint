name: Release

# Triggered by pushing a version tag: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Gate: run full test suite before releasing
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm test
      - run: npm run scan:fixtures

  release:
    name: Build, Attest, Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # --- Verify version matches tag ---
      - name: Verify package.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf-8')).version)")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      # --- SBOM Generation ---
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json --spec-version 1.5 || true

      - name: Generate SPDX SBOM
        run: |
          node -e "
          const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf-8'));
          const spdx = {
            spdxVersion: 'SPDX-2.3',
            dataLicense: 'CC0-1.0',
            SPDXID: 'SPDXRef-DOCUMENT',
            name: pkg.name,
            documentNamespace: 'https://github.com/complira/hintlint',
            creationInfo: {
              created: new Date().toISOString(),
              creators: ['Tool: hintlint-sbom-generator'],
              licenseListVersion: '3.19'
            },
            packages: [{
              SPDXID: 'SPDXRef-Package',
              name: pkg.name,
              versionInfo: pkg.version,
              downloadLocation: pkg.repository?.url || 'NOASSERTION',
              licenseConcluded: pkg.license,
              licenseDeclared: pkg.license,
              copyrightText: 'Copyright 2026 Complira',
              externalRefs: [{
                referenceCategory: 'PACKAGE-MANAGER',
                referenceType: 'purl',
                referenceLocator: 'pkg:npm/hintlint@' + pkg.version
              }],
              supplier: 'Organization: Complira',
              filesAnalyzed: false
            }],
            relationships: [{
              spdxElementId: 'SPDXRef-DOCUMENT',
              relatedSpdxElement: 'SPDXRef-Package',
              relationshipType: 'DESCRIBES'
            }]
          };
          require('fs').writeFileSync('sbom.spdx.json', JSON.stringify(spdx, null, 2));
          "

      # --- Supply Chain Attestation ---
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            package.json
            sbom.cdx.json

      # --- npm Publish ---
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --- GitHub Release ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            sbom.cdx.json
            sbom.spdx.json
