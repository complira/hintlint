name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run scan:fixtures

  scan:
    name: Scan Fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate SARIF report
        run: node src/cli.js fixtures/ts-basic --format sarif --output hintlint.sarif
      - name: Upload SARIF to GitHub Security
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hintlint.sarif

  action-test:
    name: Action Self-Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run HintLint Action on fixtures
        uses: ./
        with:
          target: fixtures/ts-basic
          fail-on: critical
          upload-sarif: "false"
          pr-comment: "false"
